<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PUCHI CHAIN</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- 上部HUD：最小限の情報のみ -->
    <header class="hud">
      <div class="stat-group">
        <div class="stat">
          <span class="stat-label">SCORE</span>
          <span class="stat-value" id="scoreValue">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">BEST</span>
          <span class="stat-value muted" id="bestValue">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">MAX CHAIN</span>
          <span class="stat-value muted" id="maxChainValue">0</span>
        </div>
      </div>

      <div class="controls">
        <button class="icon-btn" id="protoToggleBtn" type="button" title="灰色プロトタイプモード切替">
          プロトタイプ
        </button>
        <button class="icon-btn" id="soundToggleBtn" type="button" title="効果音切替">
          音 ON
        </button>
        <button class="icon-btn" id="tuningToggleBtn" type="button" title="パラメータ調整を開く">
          調整
        </button>
      </div>
    </header>

    <!-- メインの盤面エリア -->
    <main class="stage-wrap">
      <div class="canvas-container" id="canvasContainer">
        <canvas id="gameCanvas"></canvas>

        <!-- ゲームオーバー時の最小オーバーレイ（盤面のどこを押しても即リトライ） -->
        <div class="overlay hidden" id="gameOverOverlay">
          <div class="overlay-card">
            <div class="overlay-title">BURST</div>
            <div class="overlay-score" id="finalScore">0</div>
            <div class="overlay-sub" id="finalMeta">MAX CHAIN 0 / NEW BEST</div>
            <button class="retry-btn" id="retryBtn" type="button">もう一回（クリック / Space）</button>
          </div>
        </div>
      </div>

      <!-- 状態を示す極小の一行メッセージ（開始前のみ表示、開始後は非表示） -->
      <p class="hint" id="hintText">小さい泡を潰すと空気が隣へ逃げて膨らむ。パンパンの泡を連鎖で弾けさせよう。</p>
    </main>

    <!-- ステップ4検証用：パラメータ調整パネル（デフォルト非表示） -->
    <aside class="tuning-panel hidden" id="tuningPanel" aria-label="パラメータ調整">
      <div class="tuning-header">
        <span>パラメータ調整</span>
        <button class="text-btn" id="resetParamsBtn" type="button">初期値に戻す</button>
      </div>

      <div class="tuning-grid">
        <label class="param-row">
          <div class="param-head">
            <span>膨張スピード</span>
            <output id="speedOut">1.00x</output>
          </div>
          <input type="range" id="speedRange" min="0.5" max="2.0" step="0.05" value="1.0" />
        </label>

        <label class="param-row">
          <div class="param-head">
            <span>空気の押し出し量（隣へ逃げる空気）</span>
            <output id="transferOut">1.25x</output>
          </div>
          <input type="range" id="transferRange" min="0.5" max="2.0" step="0.05" value="1.25" />
        </label>

        <label class="param-row">
          <div class="param-head">
            <span>臨界ライン（連鎖可能になる膨らみ）</span>
            <output id="thresholdOut">68%</output>
          </div>
          <input type="range" id="thresholdRange" min="50" max="82" step="2" value="68" />
        </label>

        <label class="param-row">
          <div class="param-head">
            <span>自爆までの猶予時間</span>
            <output id="dangerOut">2.6s</output>
          </div>
          <input type="range" id="dangerRange" min="1.4" max="4.0" step="0.1" value="2.6" />
        </label>

        <label class="param-row">
          <div class="param-head">
            <span>連鎖の伝播間隔</span>
            <output id="delayOut">55ms</output>
          </div>
          <input type="range" id="delayRange" min="20" max="110" step="5" value="55" />
        </label>
      </div>
    </aside>
  </div>

  <script src="audio.js"></script>
  <script src="game.js"></script>
</body>
</html>
