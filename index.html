<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PUCHI CHAIN</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- 上部HUD：到達深度・最高深度・スコアを最小限で配置 -->
    <header class="hud">
      <div class="stat-group">
        <div class="stat">
          <span class="stat-label">DEPTH</span>
          <span class="stat-value accent" id="depthValue">0m</span>
        </div>
        <div class="stat">
          <span class="stat-label">BEST</span>
          <span class="stat-value muted" id="bestDepthValue">0m</span>
        </div>
        <div class="stat">
          <span class="stat-label">SCORE</span>
          <span class="stat-value muted" id="scoreValue">0</span>
        </div>
      </div>

      <div class="controls">
        <button class="icon-btn" id="protoToggleBtn" type="button" title="灰色プロトタイプモード切替">
          プロトタイプ
        </button>
        <button class="icon-btn" id="soundToggleBtn" type="button" title="効果音切替">
          音 ON
        </button>
        <button class="icon-btn" id="tuningToggleBtn" type="button" title="パラメータ調整を開く">
          調整
        </button>
      </div>
    </header>

    <!-- メインの縦長掘削エリア -->
    <main class="stage-wrap">
      <!-- 現在の地層名と次の地層までの進捗バー -->
      <div class="layer-bar">
        <div class="layer-meta">
          <span class="layer-name" id="layerName">LAYER 1 · SURFACE</span>
          <span class="layer-next" id="layerNext">NEXT 30m</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

      <div class="canvas-container" id="canvasContainer">
        <canvas id="gameCanvas"></canvas>

        <!-- 新しい地層へ突入したときのスプリングバナー -->
        <div class="layer-banner hidden" id="layerBanner" aria-live="polite">
          <div class="layer-banner-sub" id="layerBannerSub">DEPTH 30m</div>
          <div class="layer-banner-title" id="layerBannerTitle">EMERALD CANYON</div>
        </div>

        <!-- ゲームオーバー時の最小オーバーレイ（丸く広がる切り替え） -->
        <div class="overlay hidden" id="gameOverOverlay">
          <div class="overlay-card">
            <div class="overlay-title" id="gameOverReason">CRUSHED</div>
            <div class="overlay-score" id="finalDepth">0m</div>
            <div class="overlay-sub" id="finalMeta">SCORE 0 / MAX CHAIN 0</div>
            <button class="retry-btn" id="retryBtn" type="button">もう一回（タップ / Space）</button>
          </div>
        </div>
      </div>

      <!-- 開始前のみ表示する一行ガイド -->
      <p class="hint" id="hintText">小さい泡を押して離すと隣が膨らむ。連鎖で穴を空けて光るコアを落とし、上の赤ラインから逃げろ。</p>
    </main>

    <!-- ステップ4検証用：パラメータ調整パネル（デフォルト非表示） -->
    <aside class="tuning-panel hidden" id="tuningPanel" aria-label="パラメータ調整">
      <div class="tuning-header">
        <span>パラメータ調整</span>
        <button class="text-btn" id="resetParamsBtn" type="button">初期値に戻す</button>
      </div>

      <div class="tuning-grid">
        <label class="param-row">
          <div class="param-head">
            <span>迫るプレスの速さ</span>
            <output id="pressOut">1.00x</output>
          </div>
          <input type="range" id="pressRange" min="0.5" max="2.0" step="0.05" value="1.0" />
        </label>

        <label class="param-row">
          <div class="param-head">
            <span>空気の押し出し量（隣を膨らませる力）</span>
            <output id="transferOut">1.25x</output>
          </div>
          <input type="range" id="transferRange" min="0.6" max="2.0" step="0.05" value="1.25" />
        </label>

        <label class="param-row">
          <div class="param-head">
            <span>臨界ライン（白く光って連鎖可能になる膨らみ）</span>
            <output id="thresholdOut">68%</output>
          </div>
          <input type="range" id="thresholdRange" min="52" max="82" step="2" value="68" />
        </label>

        <label class="param-row">
          <div class="param-head">
            <span>赤泡が自爆するまでの猶予時間</span>
            <output id="dangerOut">2.0s</output>
          </div>
          <input type="range" id="dangerRange" min="1.0" max="3.5" step="0.1" value="2.0" />
        </label>

        <label class="param-row">
          <div class="param-head">
            <span>連鎖の伝播間隔</span>
            <output id="delayOut">50ms</output>
          </div>
          <input type="range" id="delayRange" min="20" max="100" step="5" value="50" />
        </label>
      </div>
    </aside>
  </div>

  <script src="audio.js"></script>
  <script src="game.js"></script>
</body>
</html>
