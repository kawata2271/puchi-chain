<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PUCHI CHAIN</title>
  <meta name="description" content="泡を押し込んで連鎖でぶち抜く、スマホでパッと遊べる物理プチプチ掘削アクション。10連鎖ごとに音と画面の輝きが進化する。" />
  <meta name="theme-color" content="#0c131c" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />

  <!-- LINE・X（Twitter）・Discord などで綺麗に表示されるOGP設定 -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="PUCHI CHAIN" />
  <meta property="og:title" content="PUCHI CHAIN — 泡を押し込んで連鎖で掘るプチプチアクション" />
  <meta property="og:description" content="小さい泡を押して隣を膨らませ、2連鎖以上で一気にぶち抜くミニマルな物理パズルアクション。オンライン順位表で競おう。" />
  <meta property="og:url" content="https://kawata2271.github.io/puchi-chain/" />
  <meta property="og:image" content="https://kawata2271.github.io/puchi-chain/ogp.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="PUCHI CHAIN" />
  <meta name="twitter:description" content="泡を押し込んで連鎖でぶち抜く、スマホでパッと遊べる物理プチプチ掘削アクション。" />
  <meta name="twitter:image" content="https://kawata2271.github.io/puchi-chain/ogp.png" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- 上部HUD：到達深度・最高深度・スコアを最小限で配置 -->
    <header class="hud">
      <div class="stat-group">
        <div class="stat">
          <span class="stat-label">DEPTH</span>
          <span class="stat-value accent" id="depthValue">0m</span>
        </div>
        <div class="stat">
          <span class="stat-label">BEST</span>
          <span class="stat-value muted" id="bestDepthValue">0m</span>
        </div>
        <div class="stat">
          <span class="stat-label">SCORE</span>
          <span class="stat-value muted" id="scoreValue">0</span>
        </div>
      </div>

      <!-- 表に出すボタンは「順位」「遊び方」「音」だけに絞り、市販アプリ風の佇まいにする -->
      <div class="controls">
        <button class="icon-btn" id="rankingBtn" type="button" title="オンライン順位表を見る">
          順位
        </button>
        <button class="icon-btn" id="helpBtn" type="button" title="動く遊び方マニュアルを見る">
          ？
        </button>
        <button class="icon-btn" id="soundToggleBtn" type="button" title="効果音切替">
          音 ON
        </button>
      </div>
    </header>

    <!-- メインの縦長掘削エリア -->
    <main class="stage-wrap">
      <!-- 現在の地層名と次の地層までの進捗バー -->
      <div class="layer-bar">
        <div class="layer-meta">
          <span class="layer-name" id="layerName">LAYER 1 · SURFACE</span>
          <span class="layer-next" id="layerNext">NEXT 30m</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

      <div class="canvas-container" id="canvasContainer">
        <canvas id="gameCanvas"></canvas>

        <!-- 新しい地層へ突入したときのスプリングバナー -->
        <div class="layer-banner hidden" id="layerBanner" aria-live="polite">
          <div class="layer-banner-sub" id="layerBannerSub">DEPTH 30m</div>
          <div class="layer-banner-title" id="layerBannerTitle">EMERALD CANYON</div>
        </div>

        <!-- ゲームオーバー時の最小オーバーレイ（丸く広がる切り替え） -->
        <div class="overlay hidden" id="gameOverOverlay">
          <div class="overlay-card">
            <div class="overlay-title" id="gameOverReason">CRUSHED</div>
            <div class="overlay-score" id="finalDepth">0m</div>
            <div class="overlay-sub" id="finalMeta">SCORE 0 / MAX CHAIN 0</div>
            <div class="overlay-rank" id="finalRank"></div>
            <div class="overlay-actions">
              <button class="retry-btn" id="retryBtn" type="button">もう一回</button>
            </div>
            <div class="overlay-sub-actions">
              <button class="sub-action-btn" id="openRankingFromResultBtn" type="button">順位を見る</button>
              <button class="sub-action-btn" id="shareResultBtn" type="button">結果をシェア</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 初回開始時のニックネーム設定モーダル -->
      <div class="modal-backdrop hidden" id="nicknameModal" role="dialog" aria-modal="true" aria-labelledby="nicknameModalTitle">
        <form class="modal-card" id="nicknameForm">
          <div class="modal-title" id="nicknameModalTitle">PLAYER NAME</div>
          <p class="modal-desc">順位表に表示するニックネームを入力してください（後から変更できます）</p>
          <input
            class="text-input"
            id="nicknameInput"
            type="text"
            maxlength="12"
            placeholder="ニックネーム（12文字まで）"
            autocomplete="nickname"
          />
          <div class="modal-actions">
            <button class="retry-btn full-btn" type="submit" id="nicknameSubmitBtn">この名前ではじめる</button>
          </div>
        </form>
      </div>

      <!-- オンライン順位表モーダル（最高得点 / 最高連鎖タブ切替） -->
      <div class="modal-backdrop hidden" id="rankingModal" role="dialog" aria-modal="true" aria-labelledby="rankingModalTitle">
        <div class="modal-card ranking-card">
          <div class="ranking-header">
            <div class="ranking-title-group">
              <div class="modal-title" id="rankingModalTitle">RANKING</div>
              <span class="mode-badge" id="rankingModeBadge">LOCAL</span>
            </div>
            <button class="close-btn" id="closeRankingBtn" type="button" aria-label="閉じる">✕</button>
          </div>

          <div class="player-strip">
            <span class="player-strip-name" id="currentPlayerName">NAME: GUEST</span>
            <button class="text-btn" id="editNicknameBtn" type="button">名前を変更</button>
          </div>

          <div class="tab-group" role="tablist">
            <button class="tab-btn active" id="tabScoreBtn" type="button" role="tab" aria-selected="true">最高得点</button>
            <button class="tab-btn" id="tabChainBtn" type="button" role="tab" aria-selected="false">最高連鎖</button>
          </div>

          <div class="ranking-list" id="rankingList">
            <div class="ranking-empty">読み込み中...</div>
          </div>
        </div>
      </div>

      <!-- 動くビジュアル・マニュアルモーダル（初回のみ自動表示、？ボタンからいつでも再表示可能） -->
      <div class="modal-backdrop hidden" id="tutorialModal" role="dialog" aria-modal="true" aria-labelledby="tutorialTitle">
        <div class="modal-card tutorial-card">
          <div class="tutorial-header">
            <span class="modal-title" id="tutorialBadge">STEP 1 / 3</span>
            <button class="text-btn" id="tutorialSkipBtn" type="button">スキップ</button>
          </div>
          <div class="tutorial-stage">
            <canvas id="tutorialCanvas"></canvas>
          </div>
          <div class="tutorial-copy">
            <h2 class="tutorial-title" id="tutorialTitle">押して育て、赤×はキャンセル</h2>
            <p class="modal-desc" id="tutorialCaption"></p>
          </div>
          <div class="tutorial-footer">
            <div class="tutorial-dots" id="tutorialDots"></div>
            <div class="tutorial-nav">
              <button class="sub-action-btn small-btn" id="tutorialPrevBtn" type="button">戻る</button>
              <button class="retry-btn small-btn" id="tutorialNextBtn" type="button">つぎへ →</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 開始前のみ表示する一行ガイド -->
      <p class="hint" id="hintText">小さい泡を押して隣を白く育て、2連鎖以上でコアを落とし続けろ。赤いラインにコアが触れると終了。</p>
    </main>

    <!-- 開発・検証ツール（初見プレイヤーが誤タップしないよう最下部に小さく格納） -->
    <footer class="dev-footer">
      <button class="dev-toggle-link" id="tuningToggleBtn" type="button" aria-expanded="false">
        開発・調整ツール ▾
      </button>

      <aside class="tuning-panel hidden" id="tuningPanel" aria-label="パラメータ調整">
        <div class="tuning-header">
          <span>開発・検証ツール</span>
          <div class="tuning-header-actions">
            <button class="icon-btn" id="protoToggleBtn" type="button" title="灰色プロトタイプモード切替">
              灰色プロトタイプ
            </button>
            <button class="text-btn" id="resetParamsBtn" type="button">初期値に戻す</button>
          </div>
        </div>

      <div class="tuning-grid">
        <label class="param-row">
          <div class="param-head">
            <span>迫るプレスの速さ</span>
            <output id="pressOut">1.00x</output>
          </div>
          <input type="range" id="pressRange" min="0.5" max="2.0" step="0.05" value="1.0" />
        </label>

        <label class="param-row">
          <div class="param-head">
            <span>空気の押し出し量（隣を膨らませる力）</span>
            <output id="transferOut">1.25x</output>
          </div>
          <input type="range" id="transferRange" min="0.6" max="2.0" step="0.05" value="1.25" />
        </label>

        <label class="param-row">
          <div class="param-head">
            <span>臨界ライン（白く光って連鎖可能になる膨らみ）</span>
            <output id="thresholdOut">65%</output>
          </div>
          <input type="range" id="thresholdRange" min="52" max="80" step="2" value="65" />
        </label>

        <label class="param-row">
          <div class="param-head">
            <span>連鎖の伝播間隔</span>
            <output id="delayOut">50ms</output>
          </div>
          <input type="range" id="delayRange" min="20" max="100" step="5" value="50" />
        </label>
      </div>
    </aside>
    </footer>
  </div>

  <script src="audio.js"></script>
  <script src="leaderboard.js"></script>
  <script src="tutorial.js"></script>
  <script src="game.js"></script>
</body>
</html>
